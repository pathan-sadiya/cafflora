<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Cafflora Coffee</title>
    <meta
      name="description"
      content="Sign in to Cafflora Coffee to revisit your orders, saved details and account."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"
      defer
    ></script>
    <script src="./js/firebase-config.js" defer></script>
    <script src="./js/app.js" defer></script>
    <script src="./js/auth.js" defer></script>
  </head>
  <body data-page="login">
    <div class="topbar">
      <div class="container topbar-inner">
        Thoughtfully brewed • Made for the moment • Always welcoming
      </div>
    </div>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="./index.html"
          ><span class="brand-mark"></span
          ><span class="brand-text"
            ><strong>Cafflora</strong><small>Coffee</small></span
          ></a
        >
        <nav class="nav-links" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./menu.html">Menu</a>
          <a href="./about.html">About</a>
          <a href="./contact.html">Contact</a>
        </nav>
        <div class="nav-actions">
          <a class="ghost-btn" href="./login.html" data-account-link>Account</a>
          <a class="icon-button" href="./cart.html" aria-label="Cart"
            ><i class="fa-solid fa-bag-shopping"></i
            ><span class="cart-badge" hidden>0</span></a
          >
          <a class="primary-btn" href="./menu.html">Order Now</a>
        </div>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-card reveal">
        <span class="kicker">Welcome back</span>
        <h2>Welcome back.</h2>
        <p class="subtle">
          Sign in to pick up where you left off and keep your orders close at hand.
        </p>

        <form id="login-form" class="form-grid" novalidate>
          <div class="form-field">
            <label for="login-phone">Mobile number</label>
            <input
              id="login-phone"
              class="input"
              type="tel"
              placeholder="Enter your mobile number"
              autocomplete="tel"
            />
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              class="input"
              type="password"
              placeholder="Enter your password"
            />
          </div>
          <div class="auth-actions">
            <label class="check-row"
              ><input type="checkbox" /> Keep me signed in</label
            >
            <button class="primary-btn" type="submit">Sign in</button>
          </div>
        </form>

        <div class="mini-links">
          <a href="./register.html">New to Cafflora? Create an account</a>
          <a href="./menu.html">Browse the menu as a guest</a>
        </div>
      </div>
    </main>
  </body>
</html>
