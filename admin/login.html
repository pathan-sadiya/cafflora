<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Cafflora Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js" defer></script>
    <script src="../js/firebase-config.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/auth.js" defer></script>
  </head>
  <body data-page="admin-login">
    <main class="auth-shell">
      <div class="auth-card reveal">
        <span class="kicker">Cafflora Admin</span>
        <h2>Admin Login</h2>
        <p class="subtle">Sign in with an account authorized for Firebase admin access.</p>
        <form id="admin-login-form" class="form-grid" novalidate>
          <div class="form-field">
            <label for="admin-email">Email</label>
            <input id="admin-email" class="input" type="email" autocomplete="username" required />
          </div>
          <div class="form-field">
            <label for="admin-password">Password</label>
            <input id="admin-password" class="input" type="password" autocomplete="current-password" required />
          </div>
          <button class="primary-btn" type="submit">Sign In</button>
        </form>
      </div>
    </main>
  </body>
</html>
