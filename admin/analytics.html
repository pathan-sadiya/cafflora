<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics | Cafflora Coffee Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js" defer></script>
    <script src="../js/firebase-config.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/admin.js" defer></script>
  </head>
  <body data-page="admin-analytics">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="brand-mark"></span>
          <div>
            <strong>Cafflora</strong><br />
            <small>Admin</small>
          </div>
        </div>
        <nav class="admin-nav">
          <a href="./index.html"><i class="fa-solid fa-house"></i> Overview</a>
          <a href="./orders.html"><i class="fa-solid fa-clipboard-list"></i> Orders</a>
          <a href="./menu.html"><i class="fa-solid fa-book-open"></i> Menu</a>
          <a href="./customers.html"><i class="fa-solid fa-user-group"></i> Customers</a>
          <a href="./tables.html"><i class="fa-solid fa-chair"></i> Tables</a>
          <a class="active" href="./analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
          <a href="../index.html"><i class="fa-solid fa-store"></i> Frontend</a>
          <a href="#" data-admin-logout><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
      </aside>
      <main class="admin-content">
        <div class="admin-toolbar">
          <div>
            <span class="kicker">Analytics</span>
            <h1 style="font-size: clamp(2.2rem, 3vw, 3rem);">Performance insights</h1>
          </div>
        </div>

        <div class="feature-grid">
          <div class="chart-card reveal">
            <div style="width:100%;"><h3>Sales · last 7 days</h3><div id="sales-chart" style="display:grid;gap:10px;margin-top:18px;"></div></div>
          </div>
          <div class="chart-card reveal">
            <div style="width:100%;"><h3>Orders by status</h3><div id="status-chart" style="display:grid;gap:10px;margin-top:18px;"></div></div>
          </div>
        </div>

        <div class="section" style="padding-top: 12px;">
          <div class="summary-box reveal">
            <h3>Popular products</h3>
            <ul id="best-selling" style="list-style: none; padding-left: 0; margin-top: 16px;"></ul>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
